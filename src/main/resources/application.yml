spring:
  application:
    name: mosaichostels-cafe
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  data:
    mongodb:
      uri: ${MONGODB_URI}
  # Reduce Tomcat thread pool to save memory on free hosting
  web:
    resources:
      add-mappings: false
server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2
    connection-timeout: 20000
# Disable unused actuator endpoints / banner
spring.main.banner-mode: off
logging:
  level:
    root: WARN
    com.hostel.ordering: INFO
