spring:
  application:
    name: mosaichostels-cafe
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  main:
    lazy-initialization: true   # defer bean creation until first use — critical for low-RAM startup

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20        # was 50 — each thread costs ~256k stack; 20 is plenty for a hostel cafe
      min-spare: 2   # was 5 — fewer idle threads at startup = less memory wasted

logging:
  level:
    root: WARN                       # was INFO — suppress noisy Spring framework logs
    com.hostel.ordering: INFO
    org.springframework.data.mongodb: WARN

management:
  endpoints:
    web:
      exposure:
        include: health              # only expose /health — actuator beans for info/loggers waste memory

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
