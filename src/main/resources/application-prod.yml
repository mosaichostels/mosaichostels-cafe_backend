server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2

spring:
  main:
    lazy-initialization: true

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

logging:
  level:
    root: WARN
    com.hostel.ordering: INFO
    org.springframework.data.mongodb: WARN
    # suppress verbose Firebase/Google HTTP client logs
    com.google: WARN
    io.grpc: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
