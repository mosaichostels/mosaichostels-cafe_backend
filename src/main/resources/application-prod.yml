server:
  port: ${PORT:7860}
  tomcat:
    threads:
      # Optimized for 16GB RAM environment
      max: 200
      min-spare: 20
    connection-timeout: 30000

spring:
  main:
    # Essential for fast startup and low idle RAM on containers
    lazy-initialization: true
    banner-mode: off

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false

logging:
  level:
    root: INFO
    com.hostel.ordering: INFO
    org.springframework.data.mongodb: WARN
    com.google: WARN
    io.grpc: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

ezee:
  mock: false
  endpoint: ${EZEE_ENDPOINT:https://live.ipms247.com/index.php/page/service.pos2pms}
  auth-code: ${EZEE_AUTH_CODE:}
  outlet: ${EZEE_OUTLET:Cafe}
  timezone: ${EZEE_TIMEZONE:Asia/Kolkata}
