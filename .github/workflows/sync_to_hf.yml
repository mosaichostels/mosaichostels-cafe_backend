name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 🚨 REPLACE 'YOUR_HF_USERNAME' with your actual Hugging Face ID
          git push --force https://mosaichostels:$HF_TOKEN@huggingface.co/spaces/mosaichostels/cafe_backend main
