name: Ping Render to Prevent Sleep

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend to prevent sleep..."
          curl -f -s -o /dev/null https://mosaichostels-cafe-backend.onrender.com/health || echo "Backend may be down"